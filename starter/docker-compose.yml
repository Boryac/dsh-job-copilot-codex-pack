services:
  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    ports:
      - "${SIDECAR_PORT:-8000}:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
# 注意：starter/sidecar/Dockerfile 基于 python:3.11-slim，先装依赖再拷代码，非 root 运行。
# Mock 模式不需要 GPU；本地 SmartResume 模型部署见 docs/ENVIRONMENT.md 第 5 节。
